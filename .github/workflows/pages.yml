name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'scripts/indexnow-config.mjs'
      - 'scripts/submit-indexnow.mjs'
      - 'indexnow.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/configure-pages@v5
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # 部署步骤偶尔报「Found 0 artifact(s)」——同一天里 5 次撞了 2 次。查过日志：
      # 上一步 upload-pages-artifact 明明打完包、finalize 成功、还报了 artifact ID，
      # 0.09 秒之后 deploy-pages 就查不到它。这是 GitHub 侧的最终一致性，不是配置错，
      # 日志自己都写着「suggest retry later」。
      # 静态站点因为一次查不到 artifact 就停在旧版本，代价比多等一会儿大得多，
      # 所以最多三次，40s / 90s；只有最后一次失败时 job 才红。
      - name: Deploy Pages (attempt 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before attempt 2
        if: steps.deployment.outcome == 'failure'
        run: sleep 40
      - name: Deploy Pages (attempt 2)
        id: deployment_retry
        continue-on-error: true
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Wait before attempt 3
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 90
      - name: Deploy Pages (attempt 3 — final)
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow about deployed URLs
        id: indexnow
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
      - name: Archive IndexNow submission receipt
        if: always() && steps.indexnow.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-${{ github.run_id }}
          path: docs/e2e/indexnow-submission.json
          if-no-files-found: warn
          retention-days: 30
