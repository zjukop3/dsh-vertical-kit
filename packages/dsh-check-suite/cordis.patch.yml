    - id: check-release-notes
      name: 'dsh-release-notes-check'
    - id: check-resume
      name: 'dsh-resume-check'
    - id: check-security-advisory
      name: 'dsh-security-advisory-check'
    - id: check-spec-doc
      name: 'dsh-spec-doc-check'
    - id: check-test-report
